[project]
name = "xbrain-data-engineer-assessment"
version = "0.1.0"
description = "Auditable local log-pipeline proof of concept"
requires-python = ">=3.12,<3.15"
dependencies = [
    "duckdb==1.5.5",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
